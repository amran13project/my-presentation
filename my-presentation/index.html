<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Presentation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================= -->
  <!-- HEADER -->
  <!-- ============================= -->

  <header class="topbar">

    <div class="logo">
      📊 My Presentation
    </div>

    <div class="toolbar">

      <button id="saveBtn">
        💾 Save
      </button>

      <button id="addImageBtn">
        🖼️ Image
      </button>

      <button id="addSlideBtn">
        ➕ Slide
      </button>

      <button id="deleteSlideBtn">
        🗑️ Delete
      </button>

      <button id="presentBtn">
        ▶️ Present
      </button>

    </div>

  </header>


  <!-- ============================= -->
  <!-- MAIN EDITOR -->
  <!-- ============================= -->

  <main class="main-container">

    <section class="editor-area">

      <div id="editor">

        <div id="slideContainer">
        </div>

      </div>


      <!-- ============================= -->
      <!-- SLIDE CONTROLS -->
      <!-- ============================= -->

      <div class="slide-controls">

        <button id="previousBtn">
          ◀
        </button>

        <span id="slideNumber">
          1 / 1
        </span>

        <button id="nextBtn">
          ▶
        </button>

        <button id="stopBtn">
          ✕ Stop
        </button>

      </div>


      <!-- ============================= -->
      <!-- SAVE STATUS -->
      <!-- ============================= -->

      <div id="saveStatus">
        Ready
      </div>

    </section>


    <!-- ============================= -->
    <!-- CLOUD SAVE -->
    <!-- ============================= -->

    <aside id="cloudSection">

      <div class="cloud-header">

        <h2>
          ☁️ Cloud Save
        </h2>

        <button id="refreshCloudBtn">
          🔄
        </button>

      </div>


      <p class="cloud-description">
        Simpan presentation anda ke Cloud
        dan buka semula pada laptop,
        telefon atau tablet.
      </p>


      <div id="savedPresentations">

        Loading...

      </div>

    </aside>

  </main>


  <!-- ============================= -->
  <!-- IMAGE INPUT -->
  <!-- ============================= -->

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden
  >


  <!-- ============================= -->
  <!-- SUPABASE -->
  <!-- ============================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!-- ============================= -->
  <!-- APP SCRIPT -->
  <!-- ============================= -->

  <script src="script.js"></script>

</body>
</html>
