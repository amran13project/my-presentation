```html
<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Presentation Cloud</title>

  <link
    rel="stylesheet"
    href="style.css?v=999">

</head>


<body>


  <!-- ================================= -->
  <!-- TOP BAR -->
  <!-- ================================= -->

  <header class="topbar">


    <!-- BRAND -->

    <div class="brand">

      <div class="brand-icon">
        P
      </div>


      <div class="brand-text">

        <strong>
          Presentation
        </strong>

        <span>
          Cloud Workspace
        </span>

      </div>

    </div>


    <!-- ================================= -->
    <!-- ALL MAIN BUTTONS -->
    <!-- ================================= -->

    <div class="toolbar">


      <!-- EDIT -->

      <button
        id="editBtn"
        class="edit-btn"
      >

        ✏️ Edit

      </button>


      <!-- SAVE -->

      <button
        id="saveBtn"
        class="primary-btn"
      >

        💾 Save

      </button>


      <!-- IMAGE -->

      <button
        id="addImageBtn"
      >

        🖼️ Image

      </button>


      <!-- ADD SLIDE -->

      <button
        id="addSlideBtn"
      >

        ＋ Slide

      </button>


      <!-- DELETE SLIDE -->

      <button
        id="deleteSlideBtn"
        class="danger-btn"
      >

        🗑️ Delete

      </button>


      <!-- PRESENT -->

      <button
        id="presentBtn"
        class="present-btn"
      >

        ▶ Present

      </button>


    </div>

  </header>


  <!-- ================================= -->
  <!-- MAIN WORKSPACE -->
  <!-- ================================= -->

  <main class="workspace">


    <!-- ================================= -->
    <!-- LEFT SLIDE SIDEBAR -->
    <!-- ================================= -->

    <aside class="slide-sidebar">


      <!-- SIDEBAR HEADER -->

      <div class="sidebar-title">


        <div>

          <strong>
            Slides
          </strong>


          <small id="slideNumber">
            1 / 1
          </small>

        </div>


        <!-- SMALL ADD BUTTON -->

        <button
          id="newSlideSmallBtn"
          class="small-add-btn"
        >

          ＋

        </button>


      </div>


      <!-- SLIDE THUMBNAILS -->

      <div id="slideThumbnails">
      </div>


    </aside>


    <!-- ================================= -->
    <!-- EDITOR -->
    <!-- ================================= -->

    <section class="editor-area">


      <!-- EDITOR HEADER -->

      <div class="editor-top">


        <div>

          <span class="editor-label">
            EDITOR
          </span>


          <h1>
            Presentation Editor
          </h1>

        </div>


        <!-- SAVE STATUS -->

        <div id="saveStatus">
          Ready
        </div>


      </div>


      <!-- ================================= -->
      <!-- SLIDE CANVAS -->
      <!-- ================================= -->

      <div id="editor">


        <div id="slideContainer">
        </div>


      </div>


      <!-- ================================= -->
      <!-- NORMAL SLIDE CONTROLS -->
      <!-- ================================= -->

      <div class="slide-controls">


        <!-- PREVIOUS -->

        <button
          id="previousBtn"
          class="navigation-btn"
        >

          ←

        </button>


        <!-- COUNTER -->

        <span id="slideCounter">
          1 / 1
        </span>


        <!-- NEXT -->

        <button
          id="nextBtn"
          class="navigation-btn"
        >

          →

        </button>


        <!-- STOP -->

        <button
          id="stopBtn"
          class="stop-btn"
        >

          ✕ Stop

        </button>


      </div>


    </section>


    <!-- ================================= -->
    <!-- CLOUD PANEL -->
    <!-- ================================= -->

    <aside id="cloudSection">


      <!-- CLOUD HEADER -->

      <div class="cloud-header">


        <div>

          <span class="cloud-label">
            CLOUD
          </span>


          <h2>
            ☁️ My Presentations
          </h2>

        </div>


        <!-- REFRESH -->

        <button
          id="refreshCloudBtn"
          class="refresh-btn"
        >

          ↻

        </button>


      </div>


      <!-- DESCRIPTION -->

      <p class="cloud-description">

        Simpan, buka dan edit
        presentation anda dari
        mana-mana peranti.

      </p>


      <!-- CLOUD STATUS -->

      <div class="cloud-status">

        <span class="status-dot">
        </span>


        Cloud connected

      </div>


      <!-- SAVED PRESENTATIONS -->

      <div id="savedPresentations">

        Loading...

      </div>


    </aside>


  </main>


  <!-- ================================= -->
  <!-- IMAGE INPUT -->
  <!-- ================================= -->

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden
  >


  <!-- ================================= -->
  <!-- PRESENTATION NAVIGATION -->
  <!-- ONLY APPEARS DURING PRESENT -->
  <!-- ================================= -->

  <div id="presentationNavigation">


    <!-- PRESENT PREVIOUS -->

    <button
      id="presentationPrevBtn"
      aria-label="Previous slide"
    >

      ←

    </button>


    <!-- PRESENT NEXT -->

    <button
      id="presentationNextBtn"
      aria-label="Next slide"
    >

      →

    </button>


  </div>


  <!-- ================================= -->
  <!-- SUPABASE -->
  <!-- ================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- ================================= -->
  <!-- APPLICATION SCRIPT -->
  <!-- ================================= -->

  <script src="script.js?v=999"></script>


</body>

</html>
```
