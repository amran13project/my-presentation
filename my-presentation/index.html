<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Presentation Cloud</title>

  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <!-- ============================= -->
  <!-- TOP BAR -->
  <!-- ============================= -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        P
      </div>

      <div class="brand-text">
        <strong>Presentation</strong>
        <span>Cloud Workspace</span>
      </div>

    </div>


    <div class="toolbar">

      <button
        id="editBtn"
        class="edit-btn">
        ✏️ Edit
      </button>

      <button
        id="saveBtn"
        class="primary-btn">
        💾 Save
      </button>

      <button id="addImageBtn">
        🖼️ Image
      </button>

      <button id="addSlideBtn">
        ＋ Slide
      </button>

      <button
        id="deleteSlideBtn"
        class="danger-btn">
        🗑️ Delete
      </button>

      <button
        id="presentBtn"
        class="present-btn">
        ▶ Present
      </button>

    </div>

  </header>


  <!-- ============================= -->
  <!-- WORKSPACE -->
  <!-- ============================= -->

  <main class="workspace">


    <!-- ============================= -->
    <!-- LEFT SIDEBAR -->
    <!-- ============================= -->

    <aside class="slide-sidebar">

      <div class="sidebar-title">

        <div>

          <strong>Slides</strong>

          <small id="slideNumber">
            1 / 1
          </small>

        </div>

        <button
          id="newSlideSmallBtn"
          class="small-add-btn">
          ＋
        </button>

      </div>


      <div id="slideThumbnails">
      </div>

    </aside>


    <!-- ============================= -->
    <!-- EDITOR -->
    <!-- ============================= -->

    <section class="editor-area">


      <div class="editor-top">

        <div>

          <span class="editor-label">
            EDITOR
          </span>

          <h1>
            Presentation Editor
          </h1>

        </div>


        <div id="saveStatus">
          Ready
        </div>

      </div>


      <!-- CANVAS -->

      <div id="editor">

        <div id="slideContainer">
        </div>

      </div>


      <!-- ============================= -->
      <!-- SLIDE CONTROLS -->
      <!-- ============================= -->

      <div class="slide-controls">

        <button
          id="previousBtn"
          class="navigation-btn">
          ←
        </button>


        <span id="slideCounter">
          1 / 1
        </span>


        <button
          id="nextBtn"
          class="navigation-btn">
          →
        </button>


        <button
          id="stopBtn"
          class="stop-btn">
          ✕ Stop
        </button>

      </div>


    </section>


    <!-- ============================= -->
    <!-- CLOUD -->
    <!-- ============================= -->

    <aside id="cloudSection">


      <div class="cloud-header">

        <div>

          <span class="cloud-label">
            CLOUD
          </span>

          <h2>
            ☁️ My Presentations
          </h2>

        </div>


        <button
          id="refreshCloudBtn"
          class="refresh-btn">
          ↻
        </button>

      </div>


      <p class="cloud-description">

        Simpan, buka dan edit
        presentation anda dari
        mana-mana peranti.

      </p>


      <div class="cloud-status">

        <span class="status-dot"></span>

        Cloud connected

      </div>


      <div id="savedPresentations">
        Loading...
      </div>


    </aside>

  </main>


  <!-- ============================= -->
  <!-- IMAGE INPUT -->
  <!-- ============================= -->

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden>


  <!-- ============================= -->
  <!-- SUPABASE -->
  <!-- ============================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!-- ============================= -->
  <!-- APP -->
  <!-- ============================= -->

  <script src="script.js"></script>

</body>

</html>
